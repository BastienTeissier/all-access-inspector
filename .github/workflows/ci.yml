name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint and typecheck
        run: make check-all

      - name: Test
        run: make test-django
