# Access Inspector: fail the PR when the Committed Inventory no longer matches the code.
# Template filled by the Agent (one placeholder per name below), then proposed to the project as tools/access-inspector/ci-snippet.yml:
#   setup: the toolchain setup steps of the project's own test job (e.g. actions/setup-python)
#   install: the project's own install command; nothing outside its stack
#   check: the stack's check command, e.g. python tools/access-inspector/inspect.py --check
# Exit 1: inventory drift, with a per-endpoint diff.
# Exit 2: no inventory could be produced or read (boot failure, invalid rules or dimensions,
#         missing or corrupt inventory.json).
access-inspector:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    {{setup}}
    - name: Install the project
      run: |
        {{install}}
    - name: Check the Endpoint Inventory
      run: |
        {{check}}
