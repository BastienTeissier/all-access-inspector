[project]
name = "access-inspector-django"
version = "0.0.0"  # unused (package = false); the toolkit version lives in ../../VERSION
description = "Django Base Script of all-access-inspector (vendored into projects, never installed)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.11.2,<0.12.0",
    "pytest>=8,<9",
    "mypy>=1.8.0,<2.0",
    "jsonschema>=4.23,<5",
    "types-jsonschema>=4.23,<5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
