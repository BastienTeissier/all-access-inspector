[project]
name = "access-inspector-django"
version = "0.0.0"  # unused (package = false); the toolkit version lives in ../../VERSION
description = "Django Base Script of all-access-inspector (vendored into projects, never installed)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.11.2,<0.12.0",
    "pytest>=8,<9",
    "mypy>=1.8.0,<2.0",
    "jsonschema>=4.23,<5",
    "types-jsonschema>=4.23,<5",
    "pytest-cov>=6,<7",
    "deptry>=0.23,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The project's own Django and DRF, untyped here: the Base Script never installs them.
module = ["django.*", "rest_framework.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["access_inspector"]
# Django-bound modules run only inside a booted project: the fixture golden tests cover them.
omit = ["access_inspector/classify.py", "access_inspector/discovery.py", "access_inspector/inspect.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.deptry]
known_first_party = ["access_inspector"]

[tool.deptry.per_rule_ignores]
# The project's own Django and DRF: the Base Script runs inside the audited project and never declares them.
DEP001 = ["django", "rest_framework"]
